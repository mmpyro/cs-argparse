name: Build and Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ArgParse.sln
    - name: Build
      run: dotnet build ArgParse.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test ArgParse.sln --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    - name: Upload coverage to GitHub
      uses: 5monkeys/cobertura-action@v0.5.0
      with:
        path: "**/coverage.cobertura.xml"
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        branch_coverage: true
    - name: Publish Test Results
      if: github.event_name == 'pull_request'
      uses: dorny/test-reporter@v1
      with:
        name: .NET Tests
        path: '**/*.trx'
        reporter: dotnet-trx

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ArgParse.sln
    - name: Build
      run: dotnet build ArgParse.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test ArgParse.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
    - name: Pack
      run: dotnet pack ArgParse/ArgParse.csproj --configuration Release --no-build --output ./nupkg
    - name: Push to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate